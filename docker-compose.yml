services:
  hogwarts:
    image: node:22-alpine
    container_name: hogwarts
    restart: unless-stopped
    user: "1000:1000"          # run `id pixel` - change if pixel is not 1000
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - WEB_ROOT=/data
      # admin login: put ADMIN_USER and ADMIN_PASSWORD in a .env file next to this one (never commit it)
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # set to 1 if the site is served over https but the proxy does not send X-Forwarded-Proto
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
    volumes:
      - ./server:/app:ro       # the small backend (server.js)
      - ./data:/data           # website + everything you upload; boards live in data/db/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/boards"]
      interval: 30s
      timeout: 5s
      retries: 3
