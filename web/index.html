<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARDET — Minecraft Server</title>
<meta name="description" content="ARDET: Status, Neuigkeiten, Regeln, Plugin-Wünsche und der Community Hub für unseren Hogwarts-Bau auf mc.ardet.de.">
<meta name="theme-color" content="#162222">
<link rel="icon" type="image/png" href="/favicon.png">
<script>
  // Before first paint: theme (stored choice, else night) and the view from the URL hash.
  (function () {
    var root = document.documentElement, theme;
    try { theme = localStorage.getItem('ardet-theme'); } catch (e) {}
    root.dataset.theme = theme || 'dark';
    var view = location.hash.replace(/^#\/?/, '').split('/')[0];
    root.dataset.view = /^(start|neuigkeiten|regeln|beitreten|hub|wuensche|map|staff|admin)$/.test(view) ? view : 'start';
    root.classList.add('js');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Spectral:ital,wght@0,300;1,300;1,400&display=swap">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
